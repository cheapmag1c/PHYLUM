name: Evolve PHYLUM

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phylum-evolution
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out lineage
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Advance living world checkpoint
        run: python -m phylum evolve --steps 1 --lineage "$GITHUB_REPOSITORY"

      - name: Verify simulation invariants
        run: python -m unittest discover -s tests -v

      - name: Print state
        run: python -m phylum status

      - name: Print observation delta
        run: python -m phylum changes

      - name: Print PALEON planetary state
        run: python -m phylum paleon

      - name: Print NERVE state
        run: python -m phylum nerve

      - name: Print TECHNE cultural state
        run: python -m phylum techne

      - name: Print SOCIUS social state
        run: python -m phylum socius

      - name: Print VIVARIUM engine state
        run: python -m phylum vivarium

      - name: Commit fossil record
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No world changes detected."
            exit 0
          fi

          git config user.name "phylum-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MESSAGE="$(python -m phylum commit-message)"

          git add world/ renders/ fossils/ docs/ README.md
          git commit -m "$MESSAGE"
          git push origin "HEAD:${GITHUB_REF_NAME}"
