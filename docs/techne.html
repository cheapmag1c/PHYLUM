<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHYLUM / TECHNE</title><style>body{margin:0;background:#071014;color:#dce8e2;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}header{padding:22px 28px;border-bottom:1px solid #263b38}main{padding:24px;max-width:1300px;margin:auto}.muted{color:#738a84}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.card{border:1px solid #263b38;background:#0b1719;border-radius:9px;padding:16px}.site{border-left:3px solid #8eb3a2;padding-left:10px;margin:8px 0}input{background:#0b1719;color:#dce8e2;border:1px solid #263b38;border-radius:6px;padding:9px;width:min(520px,95%)}a{color:#a7c3b7}</style></head><body><header><b>PHYLUM / TECHNE</b><div class="muted">cultural inheritance · material traces · archaeology · generation 000080</div></header><main><p><a href="index.html">← Observatory</a></p><input id="q" placeholder="filter cultures, practices, sites"><h2>Living cultures</h2><div id="grid" class="grid"></div><h2>Archaeological sites</h2><div id="sites"></div></main><script>const DATA={"generation":80,"statistics":{"active_sites":0,"archived_sites":0,"cultural_lineages_ever":0,"living_cultural_lineages":0,"practices":0,"ruins":0},"lineages":[{"id":"sp-00001","name":"pale filament","population":315.28,"capacities":{"construction":0.10475,"cultural_storage":0.23135,"innovation":0.16422,"language":0.21112,"material_skill":0.11956,"transmission":0.09366},"dialect":{"divergence":0.0,"family":"chemical+visual-display","variant":"d-65589"},"practices":[],"statistics":{"innovations":0,"lost_practices":0,"received_practices":0,"sites_created":0}},{"id":"sp-00002","name":"silt frond","population":221.61,"capacities":{"construction":0.14811,"cultural_storage":0.31343,"innovation":0.21687,"language":0.28707,"material_skill":0.14698,"transmission":0.13561},"dialect":{"divergence":0.0,"family":"chemical","variant":"d-32634"},"practices":[],"statistics":{"innovations":0,"lost_practices":0,"received_practices":0,"sites_created":0}},{"id":"sp-00003","name":"glass mote","population":313.29,"capacities":{"construction":0.1398,"cultural_storage":0.29834,"innovation":0.18469,"language":0.275,"material_skill":0.12847,"transmission":0.13971},"dialect":{"divergence":0.0,"family":"chemical+visual-display","variant":"d-64885"},"practices":[],"statistics":{"innovations":0,"lost_practices":0,"received_practices":0,"sites_created":0}}],"sites":[],"cultural_lineages":[]};const q=document.getElementById('q'),grid=document.getElementById('grid'),sites=document.getElementById('sites');function draw(){const s=q.value.toLowerCase();grid.innerHTML=DATA.lineages.filter(x=>JSON.stringify(x).toLowerCase().includes(s)).map(x=>`<div class="card"><b>${x.name}</b><div class="muted">${Math.round(x.population).toLocaleString()} organisms · ${x.dialect?.variant||'no dialect'}</div><p>${(x.practices||[]).map(p=>p.name).join(' · ')||'no persistent TECHNE practices yet'}</p></div>`).join('');sites.innerHTML=DATA.sites.filter(x=>JSON.stringify(x).toLowerCase().includes(s)).slice().reverse().map(x=>`<div class="site"><b>${x.kind}</b> · ${x.practice} <span class="muted">${x.status} · gen ${String(x.origin_generation).padStart(6,'0')}</span></div>`).join('')||'<div class="muted">no archaeological sites yet</div>'}q.addEventListener('input',draw);draw();</script></body></html>
